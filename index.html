<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4285F4" />
<title>ERSA · Çin Ofisi Takip</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
:root{
  --blue:#4285F4; --link:#1A73E8; --pill:#E8F0FE; --dark:#3C4043; --mute:#80868B;
  --line:#E3E8EE; --zebra:#F8F9FA; --bg:#F1F3F4; --white:#fff;
  --red:#EA4335; --redbg:#FCE8E6; --org:#F29900; --orgbg:#FEF0E0;
  --yel:#FBBC04; --yelbg:#FEF7E0; --grn:#34A853; --grnbg:#E6F4EA;
  --shadow:0 1px 2px rgba(60,64,67,.1),0 1px 3px rgba(60,64,67,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--dark);
  -webkit-font-smoothing:antialiased; padding-bottom:84px;
}
button{font-family:inherit}
.appbar{
  position:sticky; top:0; z-index:30; background:var(--white);
  padding:14px 16px calc(14px + env(safe-area-inset-top)); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px;
}
.appbar .logo{color:var(--blue); font-size:20px; font-weight:700; line-height:1}
.appbar h1{font-size:15px; margin:0; font-weight:700; color:var(--dark)}
.appbar .sub{font-size:11px; color:var(--mute); font-weight:400}
.appbar .spacer{flex:1}
.refresh{border:none;background:var(--pill);color:var(--link);font-weight:700;
  border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}
.refresh:active{transform:scale(.96)}

.wrap{max-width:720px;margin:0 auto;padding:14px}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--pill);border-radius:14px;padding:12px 14px}
.kpi .lab{font-size:11px;font-weight:700;color:var(--link);letter-spacing:.2px}
.kpi .val{font-size:26px;font-weight:700;color:var(--dark);line-height:1.1;margin-top:4px}
.kpi .cap{font-size:10px;color:var(--mute);margin-top:2px}
.kpi.alert .val{color:var(--red)}
.kpi.warn .val{color:var(--org)}

.sechead{display:flex;align-items:baseline;gap:8px;margin:20px 2px 10px}
.sechead h2{font-size:15px;margin:0;font-weight:700;color:var(--dark)}
.sechead span{font-size:11px;color:var(--mute)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:20px;white-space:nowrap}
.c-red{background:var(--redbg);color:var(--red)}
.c-org{background:var(--orgbg);color:var(--org)}
.c-yel{background:var(--yelbg);color:#9A6700}
.c-grn{background:var(--grnbg);color:var(--grn)}
.c-blue{background:var(--pill);color:var(--link)}
.c-grey{background:#EEF0F2;color:var(--mute)}

/* list cards */
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.card:active{background:var(--zebra)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .no{font-size:11px;font-weight:700;color:var(--mute)}
.card .cust{font-size:15px;font-weight:700;color:var(--dark);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .prod{font-size:13px;color:var(--dark);margin-bottom:8px}
.card .meta{font-size:11px;color:var(--mute);margin-bottom:8px}
.card .chips{display:flex;flex-wrap:wrap;gap:6px}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.filters button{border:1px solid var(--line);background:var(--white);color:var(--dark);
  border-radius:20px;padding:7px 13px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.filters button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  font-size:14px;margin-bottom:12px;background:var(--white)}
.search:focus{outline:2px solid var(--pill);border-color:var(--blue)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:none;background:none;padding:9px 0 11px;cursor:pointer;
  color:var(--mute);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:18px;line-height:1}
.nav button.on{color:var(--link)}

/* FAB */
.fab{position:fixed;right:18px;bottom:84px;z-index:45;background:var(--blue);color:#fff;
  border:none;border-radius:18px;padding:14px 18px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 12px rgba(66,133,244,.4);display:flex;align-items:center;gap:6px}
.fab:active{transform:scale(.96)}

/* modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(32,33,36,.5);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--white);
  border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:translateY(0)}
@media(min-width:560px){.sheet{max-width:560px;margin:0 auto;border-radius:18px;bottom:auto;top:50%;
  transform:translate(0,-50%) scale(.96);opacity:0}.sheet.open{transform:translate(0,-50%) scale(1);opacity:1}}
.sheet .hd{position:sticky;top:0;background:var(--white);padding:16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;z-index:2}
.sheet .hd h3{margin:0;font-size:16px;flex:1}
.sheet .hd .x{border:none;background:var(--bg);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--mute)}
.form{padding:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;font-size:14px;background:var(--white);color:var(--dark)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--pill);border-color:var(--blue)}
.field textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.save:active{transform:scale(.99)} .save:disabled{opacity:.6}
.ghost{width:100%;background:var(--bg);color:var(--dark);border:none;border-radius:12px;padding:12px;
  font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}

.empty{text-align:center;color:var(--mute);padding:50px 20px}
.empty .big{font-size:34px;margin-bottom:8px}
.empty p{font-size:14px;margin:4px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--dark);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;
  opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.banner{background:var(--orgbg);color:#9A6700;border-radius:12px;padding:12px 14px;font-size:13px;
  margin-bottom:12px;font-weight:600;display:none}
.banner.show{display:block}
.dist{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dist .r{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px}
.dist .r:nth-child(even){background:var(--zebra)}
.dist .r b{font-weight:700}
.loading{text-align:center;color:var(--mute);padding:40px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="appbar">
  <span class="logo">▲</span>
  <div>
    <h1>ERSA GROUP</h1>
    <div class="sub">Çin Ofisi · Talep & Sipariş Takip</div>
  </div>
  <div class="spacer"></div>
  <button class="refresh" id="btnRefresh">Yenile</button>
</div>

<div class="wrap">
  <div id="banner" class="banner"></div>

  <!-- PANEL -->
  <section id="view-panel" class="view active">
    <div id="panelBody" class="loading">Yükleniyor…</div>
  </section>

  <!-- TALEPLER -->
  <section id="view-talep" class="view">
    <input id="search" class="search" placeholder="Müşteri, ürün veya talep no ara…" />
    <div class="filters" id="filters">
      <button data-f="hepsi" class="on">Hepsi</button>
      <button data-f="geciken">Geciken takip</button>
      <button data-f="bugun">Bugün/3 gün</button>
      <button data-f="siparis">Açık sipariş</button>
      <button data-f="teslim">Teslim yaklaşan</button>
    </div>
    <div id="talepList"></div>
  </section>

  <!-- MÜŞTERİLER -->
  <section id="view-must" class="view">
    <input id="searchM" class="search" placeholder="Müşteri ara…" />
    <div id="mustList"></div>
  </section>
</div>

<button class="fab" id="fab">＋ Yeni</button>

<nav class="nav">
  <button data-v="panel" class="on"><span class="ic">▦</span>Panel</button>
  <button data-v="talep"><span class="ic">▤</span>Talepler</button>
  <button data-v="must"><span class="ic">☺</span>Müşteriler</button>
</nav>

<!-- Sheet / modal -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="hd"><h3 id="sheetTitle">Yeni Talep</h3><button class="x" id="sheetClose">✕</button></div>
  <div class="form" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
